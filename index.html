<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Diverso</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:Inter, sans-serif; background:#fff; color:#111; }
  .top { background:#3F2A2F; color:#fff; text-transform:uppercase; font-size:12px; letter-spacing:.08em; text-align:center; padding:8px; }
  main { max-width:640px; margin:15vh auto; padding:0 24px; text-align:center; }
  h1 { font-family:Poppins, sans-serif; font-weight:700; text-transform:uppercase; font-size:28px; margin:0 0 12px; }
  p { color:#555; }
  .tag { display:inline-block; background:#8FADC5; color:#fff; border-radius:40px; padding:4px 14px; font-size:12px; margin-bottom:16px; }
</style>
</head>
<body>
  <div class="top">Diverso by Pili · Dashboard de familias</div>
  <main>
    <span class="tag">En construcción</span>
    <h1>Dashboard Diverso</h1>
    <p>Productos de Tiendanube, familias y creativos en un solo lugar.</p>
  </main>
</body>
</html>
